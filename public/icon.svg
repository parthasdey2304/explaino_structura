<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="50%" stop-color="#0f0f17" />
      <stop offset="100%" stop-color="#07070b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Grid Blueprint Accents -->
  <path d="M128 96 L128 416 M256 96 L256 416 M384 96 L384 416 M96 128 L416 128 M96 256 L416 256 M96 384 L416 384"
        stroke="rgba(255,255,255,0.04)" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Central Explaino Whiteboard Card -->
  <rect x="112" y="112" width="288" height="288" rx="36" fill="#1e1e2d" stroke="url(#primaryGrad)" stroke-width="6" />

  <!-- Inner Canvas Elements -->
  <!-- Architecture Node 1 -->
  <rect x="152" y="156" width="88" height="54" rx="14" fill="rgba(99,102,241,0.2)" stroke="#818cf8" stroke-width="4" />
  <circle cx="174" cy="183" r="6" fill="#38bdf8" />
  <line x1="192" y1="183" x2="222" y2="183" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round" />

  <!-- Architecture Node 2 -->
  <rect x="272" y="272" width="88" height="54" rx="14" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="4" />
  <circle cx="294" cy="299" r="6" fill="#818cf8" />
  <line x1="312" y1="299" x2="342" y2="299" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round" />

  <!-- Connecting Dynamic Curve / Arrow -->
  <path d="M240 183 C270 183, 272 230, 272 272" fill="none" stroke="#a5b4fc" stroke-width="5" stroke-dasharray="7 5" stroke-linecap="round" />

  <!-- Stylus / Smart Board Pen (Drawing on Canvas) -->
  <g transform="translate(230, 210) rotate(-45)">
    <path d="M0 0 L24 -12 L110 -12 L130 0 L110 12 L24 12 Z" fill="url(#primaryGrad)" />
    <polygon points="0,0 24,-12 24,12" fill="#e0e7ff" />
    <circle cx="4" cy="0" r="3" fill="#38bdf8" />
    <rect x="110" y="-12" width="28" height="24" rx="4" fill="#312e81" />
  </g>

  <!-- Dynamic Glowing Ink Trail -->
  <path d="M190 330 C220 360, 280 370, 340 340" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
</svg>
